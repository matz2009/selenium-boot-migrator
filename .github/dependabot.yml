# Dependency alerting for selenium-boot-migrator.
#
# pom.xml pins every dependency to an exact version, so Dependabot always has
# something to compare against.
#
# Not auto-merged: a bumped PR still has to clear `mvn verify` before it's
# mergeable, same bar as any other change to this repo.
version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "deps"

  # Workflows pin actions by major tag; this catches the ones that go stale.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci"
